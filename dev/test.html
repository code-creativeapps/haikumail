<!doctype html>
<!--
  Harness for driving the overlay without a real inbox. Serve the repo root and
  open /dev/test.html. The markup below imitates the parts of Gmail's DOM the
  reader depends on (tr.zA rows, .hP subject, .ii.gt body) and reacts to the
  same #search/... hash the reader navigates to.

  Add ?fast to skip most of the cool-down while poking at the UI.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Inbox (42) - fake</title>
    <link rel="stylesheet" href="../dist/mask.css" />
  </head>
  <body>
    <script src="fixtures.js"></script>
    <h1>PRETEND GMAIL — you should not be able to see this</h1>
    <table><tbody id="list"></tbody></table>
    <div id="thread" hidden></div>

    <script>
      // Rows come from dev/fixtures.js. `?rows=shots` swaps the layout-stressing
      // set for the tidy invented inbox used for the store screenshots.
      const ROWS = new URLSearchParams(location.search).get('rows') || 'dev'
      const FAKE = window.FIXTURES[ROWS]
      let n = 0
      /**
       * Gmail filters; so does this. Without it every query returns the whole
       * fixture, which reads as broken the moment you look at the results —
       * a "Newsletters" filter answering with someone's invoice.
       *
       * `label:^smartlabel_x` matches a row's labels, anything else is a
       * substring match over sender, subject and snippet.
       */
      function matches(row, query) {
        const [from, subj, snip, , , labels = []] = row
        const label = query.match(/label:\^smartlabel_(\w+)/)
        if (label) return labels.includes(label[1])
        const category = query.match(/category:(\w+)/)
        if (category) return labels.includes(category[1])
        if (query.startsWith('is:starred')) return labels.includes('starred')
        const terms = query.toLowerCase().split(/\s+/).filter(Boolean)
        const hay = `${from} ${subj} ${snip}`.toLowerCase()
        return terms.every((t) => hay.includes(t))
      }

      let lastQuery = ''
      function renderList() {
        n++
        document.getElementById('thread').hidden = true
        // Original indices are carried through so a row still opens itself
        // after the list has been filtered.
        document.getElementById('list').innerHTML = FAKE.map((row, i) => [row, i])
          .filter(([row]) => matches(row, lastQuery))
          .map(
          ([[from, subj, snip, date, unread], i]) => `
          <tr class="zA ${unread ? 'zE' : 'yO'}" id="row-${n}-${i}">
            <td class="yX xY"><span data-legacy-thread-id="t${i}" data-thread-id="#thread-f:t${i}"></span>
              <div class="yW"><span class="bare">${from}</span><span translate="no" email="x@y.z" name="${from}">${from}</span><span class="bare"></span></div></td>
            <td class="xY"><div class="y6"><span>${subj}</span></div><span class="y2"> - ${snip}</span></td>
            <td class="xW xY"><span title="${date}">${date.slice(0, 6)}</span></td>
          </tr>`,
        ).join('')
      }
      function renderThread(id) {
        const i = Number(id.replace('t', ''))
        const [from, subj, , date] = FAKE[i]
        document.getElementById('list').innerHTML = ''
        const t = document.getElementById('thread')
        t.hidden = false
        // The store fixture gets a clean message; the dev fixture keeps the
        // hostile one, which is the whole point of having it.
        const inner =
          ROWS === 'shots'
            ? window.SHOT_BODY(from)
            : `
            <style>h1 { color: crimson } div { font-family: Georgia, serif }</style>
            <table width="600" style="background:#f7f3e8;border:2px solid #123"><tr><td align="center" style="padding:24px">
              <h1 style="letter-spacing:2px">KEITH HARING</h1>
              <img src="data:image/svg+xml;utf8,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="80"><rect width="240" height="80" fill="%230b57d0"/><text x="120" y="48" font-size="20" fill="white" text-anchor="middle">IMAGE</text></svg>')}" alt="banner">
              <p style="color:#c33;font-size:28px;font-weight:bold">01:21:09:01</p>
              <a href="https://example.com" style="background:#123;color:#fff;padding:12px 20px;text-decoration:none">GET ACCESS</a>
              <a href="javascript:alert(1)">unsafe link</a>
              <img src="x" onerror="document.title='PWNED'">
              <${''}script>document.title = 'PWNED'<\/script>
            </td></tr></table>
            <div>Hi there,</div><div><br></div><div>Here is the thing you actually came here for.</div><div><br></div><div>Best,<br>${from}</div>
            <div class="gmail_quote">On Tue, someone wrote: quoted history that should be dropped</div>`

        t.innerHTML = `<h2 class="hP">${subj}</h2>
          <span class="gD" name="${from}">${from}</span><span class="g3" title="${date}">${date}</span>
          <div class="ii gt"><div class="a3s">${inner}</div></div>`
      }

      function route() {
        const m = location.hash.match(/^#search\/([^/]+)(?:\/(.+))?/)
        if (m) lastQuery = decodeURIComponent(m[1])
        setTimeout(() => (m && m[2] ? renderThread(m[2]) : renderList()), 700)
      }
      addEventListener('hashchange', route)
      renderList()
    </script>
    <script src="../dist/content.js"></script>
  </body>
</html>
